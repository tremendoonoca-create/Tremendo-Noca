<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREMENDO ÑOCA | Inicio</title>
  <style>
    :root {
      --top-black: #000000;
      --header-blue: #2500ff;   /* Azul intenso como el boceto */
      --card-gray: #cbd5e1;     /* Gris claro para las tarjetas de noticias */
      --white: #ffffff;
      --text-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #050814;
      color: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 1. FRANJA SUPERIOR NEGRA (Hora y Temperatura) */
    .top-bar {
      background-color: var(--top-black);
      color: var(--white);
      padding: 0.4rem 1.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* 2. BANNER PRINCIPAL AZUL */
    header {
      background-color: var(--header-blue);
      padding: 0.8rem 1.5rem;
      position: relative;
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* BOTÓN MENÚ DE 3 LÍNEAS */
    .menu-toggle {
      background: transparent;
      border: none;
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .menu-toggle:hover {
      transform: scale(1.1);
    }

    /* LOGO DERECHA TREMENDO ÑOCA */
    .brand-logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo-img {
      height: 55px;
      width: auto;
      object-fit: contain;
    }

    /* MENÚ DESPLEGABLE */
    nav.nav-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 1.5rem;
      background-color: #1a00cc;
      border: 2px solid #000;
      border-radius: 8px;
      width: 220px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 1000;
    }

    nav.nav-menu.active {
      display: block;
    }

    nav.nav-menu ul {
      list-style: none;
    }

    nav.nav-menu ul li a {
      display: block;
      padding: 0.8rem 1.2rem;
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.2s;
    }

    nav.nav-menu ul li a:hover {
      background-color: #3300ff;
    }

    /* 3. SECCIÓN PRINCIPAL CON MARCA DE AGUA Y NOTICIAS */
    main {
      flex: 1;
      position: relative;
      background-color: #030611;
      background-image: linear-gradient(rgba(3, 6, 17, 0.82), rgba(3, 6, 17, 0.82)), url('logo%20azul.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      padding: 3rem 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .news-container {
      max-width: 1200px;
      width: 100%;
    }

    /* GRILLA DE TARJETAS DE NOTICIAS */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
    }

    /* TARJETA GRIS DE NOTICIA */
    .news-card {
      background-color: var(--card-gray);
      border-radius: 16px;
      min-height: 280px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text-dark);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .news-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    }

    .news-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 0.8rem;
    }

    .news-title {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .news-btn {
      display: block;
      text-align: center;
      background-color: var(--top-black);
      color: var(--white);
      text-decoration: none;
      padding: 0.6rem 1rem;
      font-weight: 700;
      border-radius: 8px;
      margin-top: 0.8rem;
    }

    /* LOGOS DE FUENTES Y FOOTER */
    .sources-section {
      background-color: #080d1a;
      padding: 1.5rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sources-logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .source-logo {
      max-height: 35px;
      filter: grayscale(40%);
    }

    footer {
      background-color: var(--top-black);
      color: #94a3b8;
      padding: 1.5rem 1rem;
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .footer-socials {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .footer-socials img {
      height: 22px;
    }
  </style>
</head>
