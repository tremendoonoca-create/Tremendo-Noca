<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREMENDO ÑOCA | Portal Deportivo</title>
  <style>
    :root {
      --top-black: #000000;
      --header-blue: #2500ff;
      --card-gray: #cbd5e1;
      --white: #ffffff;
      --text-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', 'Segoe UI Bold', sans-serif;
    }

    body {
      background-color: #030611;
      color: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 1. FRANJA SUPERIOR CON HORA Y TEMPERATURA DE BUENOS AIRES */
    .top-bar {
      background-color: var(--top-black);
      color: var(--white);
      padding: 0.4rem 1.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .location-tag {
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* 2. ENCABEZADO AZUL */
    header {
      background-color: var(--header-blue);
      padding: 0.8rem 1.5rem;
      position: relative;
      z-index: 1000;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-toggle {
      background: transparent;
      border: none;
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
    }

    .brand-logo-img {
      height: 55px;
      width: auto;
      object-fit: contain;
      cursor: pointer;
    }

    /* MENÚ DESPLEGABLE */
    nav.nav-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 1.5rem;
      background-color: #1a00cc;
      border: 2px solid #000;
      border-radius: 8px;
      width: 220px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    nav.nav-menu.active {
      display: block;
    }

    nav.nav-menu ul {
      list-style: none;
    }

    nav.nav-menu ul li a {
      display: block;
      padding: 0.8rem 1.2rem;
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    nav.nav-menu ul li a:hover {
      background-color: #2500ff;
    }

    /* 3. SECCIONES DINÁMICAS CON MARCA DE AGUA */
    main {
      flex: 1;
      background-color: #030611;
      background-image: linear-gradient(rgba(3, 6, 17, 0.88), rgba(3, 6, 17, 0.88)), url('logo%20azul.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      padding: 2.5rem 1rem;
    }

    .page-section {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-section.active-section {
      display: block;
    }

    /* ESTILOS INICIO / MEDIOS DESTACADOS */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .media-card {
      background-color: var(--card-gray);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: var(--text-dark);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      transition: transform 0.2s;
    }

    .media-card:hover {
      transform: translateY(-5px);
    }

    .media-logo {
      width: 100%;
      height: 85px;
      object-fit: contain;
      margin-bottom: 1rem;
      background-color: #ffffff;
      padding: 0.5rem;
      border-radius: 10px;
    }

    .media-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
    }

    .news-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--top-black);
      color: var(--white);
      text-decoration: none;
      padding: 0.6rem 1rem;
      font-weight: 700;
      border-radius: 8px;
    }

    /* ESTILOS VIDEOS Y CARRUSELES */
    .category-section {
      margin-bottom: 2.5rem;
    }

    .category-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      font-family: 'Arial Black', sans-serif;
    }

    .carousel-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .carousel-row {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 0.5rem 0.2rem;
      scrollbar-width: none;
    }

    .carousel-row::-webkit-scrollbar {
      display: none;
    }

    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.85);
      color: var(--white);
      border: 2px solid var(--header-blue);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.2s;
    }

    .arrow-btn:hover {
      background-color: var(--header-blue);
      transform: translateY(-50%) scale(1.1);
    }

    .arrow-left { left: -15px; }
    .arrow-right { right: -15px; }

    .video-card-square {
      min-width: 250px;
      max-width: 250px;
      height: 220px;
      background-color: var(--card-gray);
      border-radius: 16px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
      transition: transform 0.2s;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .video-card-square:hover {
      transform: translateY(-5px);
    }

    .video-container-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      background-color: #000;
    }

    .video-container-inner iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* FOOTER */
    footer {
      background-color: var(--top-black);
      color: #94a3b8;
      padding: 1.5rem 1rem;
      text-align: center;
      font-size: 0.8rem;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .footer-socials {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .footer-socials img {
      height: 24px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
